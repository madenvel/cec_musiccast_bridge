# Discover the receiver automatically. Set a hostname or IPv4 address to
# disable discovery, for example: address = 192.168.50.201
address = auto

# Use `cec-musiccast-bridge --discover` to find the stable device_id.
# Required when multiple MusicCast receivers are present; recommended always.
# device-id = AC44F242F02A

# Receiver input connected to the TV and power-on volume (Yamaha units).
# Review the volume before starting the service: this is NOT a percentage.
input = optical1
volume = 90

# SSDP listening time, plus bounded HTTP probes of discovered renderers.
discovery-timeout = 5
# Optional local IPv4 address if discovery should use only one interface.
# interface = 192.168.50.10
